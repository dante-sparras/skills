name: eval-skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit and offline pipeline tests
        run: python3 -m unittest discover -s skills/eval-skill/scripts/tests -t skills/eval-skill/scripts

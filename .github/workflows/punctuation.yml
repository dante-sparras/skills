name: Punctuation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No em dashes
        run: python3 scripts/no-em-dashes.py skills
      - name: No semicolons
        if: ${{ !cancelled() }}
        run: python3 scripts/no-semicolons.py skills
